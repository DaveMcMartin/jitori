<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<style>
		body {
			width: 300px;
			padding: 16px;
			margin: 0;
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			background: #1f2937;
			color: #f3f4f6;
		}

		h1 {
			font-size: 1.25rem;
			margin: 0 0 1rem 0;
			background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;
		}

		p {
			font-size: 0.875rem;
			color: #9ca3af;
			margin: 0 0 1rem 0;
			line-height: 1.5;
		}

		.button {
			display: block;
			width: 100%;
			padding: 0.75rem;
			background: #3b82f6;
			color: white;
			border: none;
			border-radius: 0.375rem;
			font-size: 0.875rem;
			font-weight: 500;
			cursor: pointer;
			transition: background 0.2s;
			text-align: center;
			text-decoration: none;
		}

		.button:hover {
			background: #2563eb;
		}

		.settings {
			margin-top: 1rem;
			padding-top: 1rem;
			border-top: 1px solid #374151;
		}

		.settings label {
			display: block;
			font-size: 0.75rem;
			color: #9ca3af;
			margin-bottom: 0.25rem;
		}

		.settings input {
			width: 100%;
			padding: 0.5rem;
			border: 1px solid #374151;
			border-radius: 0.25rem;
			background: #111827;
			color: #f3f4f6;
			font-size: 0.75rem;
		}

		.save-btn {
			margin-top: 0.5rem;
			padding: 0.5rem;
			background: #10b981;
			color: white;
			border: none;
			border-radius: 0.25rem;
			font-size: 0.75rem;
			cursor: pointer;
		}

		.save-btn:hover {
			background: #059669;
		}

		.status {
			margin-top: 0.75rem;
			padding: 0.5rem;
			border-radius: 0.25rem;
			font-size: 0.75rem;
			display: none;
		}

		.status.success {
			display: block;
			background: rgba(16, 185, 129, 0.1);
			color: #34d399;
			border: 1px solid rgba(16, 185, 129, 0.3);
		}
	</style>
</head>
<body>
	<h1>Jitori</h1>
	<p>Click the button below or use the extension icon to capture a screenshot and extract Japanese text.</p>

	<button id="capture-btn" class="button">Capture Screenshot</button>

	<div class="settings">
		<label for="site-url">Jitori Site URL</label>
		<input type="text" id="site-url" placeholder="https://yourusername.github.io/jitori" />
		<button id="save-btn" class="save-btn">Save Settings</button>
	</div>

	<div id="status" class="status"></div>

	<script src="popup.js"></script>
</body>
</html>
